<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Chat</title>
  <style>
    :root { --bg:#f5f6f8; --panel:#fff; --text:#1c2230; --muted:#6b7280; --border:#e3e6eb; --accent:#7c4dff; --mine:#efe9ff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#13151a; --panel:#1c1f26; --text:#e7e9ee; --muted:#9aa1ad; --border:#2c303a; --mine:#2c2547; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:.8rem 1.2rem; background:var(--panel); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:1rem; }
    header h1 { font-size:1.1rem; margin:0; }
    #status { font-size:.85rem; color:var(--muted); }
    input, button { font:inherit; padding:.55rem .75rem; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); }
    button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
    #join { margin:auto; display:grid; gap:.6rem; width:min(340px, 90vw); background:var(--panel); padding:1.5rem; border-radius:12px; border:1px solid var(--border); }
    #join h2 { margin:0 0 .5rem; }
    #rooms { font-size:.85rem; color:var(--muted); }
    #rooms a { color:var(--accent); cursor:pointer; margin-right:.5rem; }
    #chat { flex:1; display:none; min-height:0; }
    #chat.active { display:grid; grid-template-columns:1fr 200px; }
    @media (max-width:640px) { #chat.active { grid-template-columns:1fr; } aside { display:none; } }
    .main { display:flex; flex-direction:column; min-height:0; }
    #messages { flex:1; overflow-y:auto; padding:1rem 1.2rem; display:flex; flex-direction:column; gap:.4rem; }
    .msg { max-width:75%; padding:.5rem .75rem; border-radius:10px; background:var(--panel); border:1px solid var(--border); align-self:flex-start; overflow-wrap:anywhere; }
    .msg.mine { align-self:flex-end; background:var(--mine); }
    .msg .meta { font-size:.75rem; color:var(--muted); margin-bottom:.15rem; }
    .notice { align-self:center; font-size:.8rem; color:var(--muted); }
    .notice.error { color:#d64545; }
    form#send { display:flex; gap:.5rem; padding:.75rem 1.2rem; border-top:1px solid var(--border); background:var(--panel); }
    form#send input { flex:1; min-width:0; }
    aside { border-left:1px solid var(--border); padding:1rem; background:var(--panel); overflow-y:auto; }
    aside h3 { font-size:.8rem; text-transform:uppercase; color:var(--muted); margin:0 0 .5rem; }
    aside ul { list-style:none; margin:0; padding:0; display:grid; gap:.3rem; }
  </style>
</head>
<body>
  <header>
    <h1>Live Chat <span id="room-title"></span></h1>
    <span id="status">not connected</span>
  </header>

  <form id="join">
    <h2>Join a room</h2>
    <input id="name" placeholder="Your name" maxlength="24" required pattern="[\p{L}\p{N}_\-]{1,24}">
    <input id="room" placeholder="Room" value="general" maxlength="24" required pattern="[\p{L}\p{N}_\-]{1,24}">
    <button>Join</button>
    <div id="rooms"></div>
  </form>

  <div id="chat">
    <div class="main">
      <div id="messages" aria-live="polite"></div>
      <form id="send">
        <input id="text" placeholder="Type a message…" maxlength="500" autocomplete="off">
        <button>Send</button>
      </form>
    </div>
    <aside><h3>Online</h3><ul id="online"></ul></aside>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let ws, me;

    async function loadRooms() {
      try {
        const rooms = await (await fetch("/api/rooms")).json();
        if (!rooms.length) return;
        $("rooms").textContent = "Active: ";
        rooms.forEach((r) => {
          const a = document.createElement("a");
          a.textContent = `#${r.name} (${r.online})`;
          a.onclick = () => ($("room").value = r.name);
          $("rooms").append(a);
        });
      } catch {}
    }

    function add(el) {
      const box = $("messages");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
      box.append(el);
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    function notice(text, cls = "") {
      const el = document.createElement("div");
      el.className = `notice ${cls}`;
      el.textContent = text;
      add(el);
    }

    function message({ user, text, ts }) {
      const el = document.createElement("div");
      el.className = "msg" + (user === me ? " mine" : "");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${user} · ${new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
      const body = document.createElement("div");
      body.textContent = text;
      el.append(meta, body);
      add(el);
    }

    function online(users) {
      $("online").replaceChildren(...users.map((u) => {
        const li = document.createElement("li");
        li.textContent = u === me ? `${u} (you)` : u;
        return li;
      }));
    }

    function connect(name, room) {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws?room=${encodeURIComponent(room)}&name=${encodeURIComponent(name)}`);
      $("status").textContent = "connecting…";
      let first = true;

      ws.onopen = () => {
        $("status").textContent = "connected";
        $("join").style.display = "none";
        $("chat").classList.add("active");
        $("room-title").textContent = `· #${room.toLowerCase()}`;
        $("text").focus();
      };
      ws.onmessage = (e) => {
        const ev = JSON.parse(e.data);
        switch (ev.type) {
          case "history": ev.messages.forEach(message); break;
          case "message": message(ev); break;
          case "join":
            // the first join event after connecting is our own; it tells us the final name
            if (first) { me = ev.user; first = false; }
            notice(`${ev.user} joined`); online(ev.online); break;
          case "leave": notice(`${ev.user} left`); online(ev.online); break;
          case "error": notice(ev.message, "error"); break;
        }
      };
      ws.onclose = () => {
        $("status").textContent = "disconnected";
        notice("Connection closed. Refresh the page to rejoin.", "error");
      };
    }

    $("join").addEventListener("submit", (e) => {
      e.preventDefault();
      connect($("name").value.trim(), $("room").value.trim());
    });

    $("send").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("text").value.trim();
      if (!text || ws?.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ text }));
      $("text").value = "";
    });

    loadRooms();
  </script>
</body>
</html>
